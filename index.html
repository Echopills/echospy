<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра Шпион</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: radial-gradient(circle at 50% 0%, #1b1730 0%, #0e0c17 55%, #09070f 100%);
    --text: #f4f2fb;
    --text-muted: #9c95b8;
    --card-bg: #171425;
    --border: #2b2542;
    --input-bg: #171425;
    --accent: #7c5cff;
    --accent2: #ff7ac8;
    --btn-grad: linear-gradient(135deg, #8360ff, #6c4ce0);
    --btn-shadow: 0 8px 24px -8px rgba(124, 92, 255, 0.55);
    --visual-bg: #0e0c17;
    --spy-color: #ff5c8a;
    --normal-color: #4ee39a;
  }

  body.theme-black {
    --bg: #000000;
    --text: #f2f2f2;
    --text-muted: #8a8a8a;
    --card-bg: #121212;
    --border: #2a2a2a;
    --input-bg: #121212;
    --accent: #ffffff;
    --accent2: #b0b0b0;
    --btn-grad: linear-gradient(135deg, #333333, #000000);
    --btn-shadow: 0 8px 20px -8px rgba(255, 255, 255, 0.12);
    --visual-bg: #0a0a0a;
    --spy-color: #ff6161;
    --normal-color: #6be38a;
  }

  body.theme-white {
    --bg: #f5f4fa;
    --text: #1b1830;
    --text-muted: #6d6683;
    --card-bg: #ffffff;
    --border: #e4e1ef;
    --input-bg: #ffffff;
    --accent: #7c5cff;
    --accent2: #ff5cab;
    --btn-grad: linear-gradient(135deg, #8360ff, #6c4ce0);
    --btn-shadow: 0 8px 20px -8px rgba(124, 92, 255, 0.35);
    --visual-bg: #f0eefa;
    --spy-color: #e0356f;
    --normal-color: #1fa869;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .logo-icon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto -18px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 8px 18px rgba(124, 92, 255, 0.45));
  }

  body.theme-white .logo-icon {
    filter: invert(1) drop-shadow(0 8px 18px rgba(124, 92, 255, 0.3));
  }

  .wordmark {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    padding-top: 24px;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  .accent-part {
    background: linear-gradient(90deg, #b79cff, var(--accent) 40%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #b79cff, var(--accent) 55%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 22px;
    font-weight: 600;
  }

  input {
    width: 110px;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    margin-bottom: 18px;
  }

  input:focus { outline: none; border-color: var(--accent); }

  button {
    padding: 15px 30px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    background: var(--btn-grad);
    color: #fff;
    cursor: pointer;
    margin: 6px;
    box-shadow: var(--btn-shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  body.theme-white button { color: #fff; }

  button:active { transform: scale(0.97); }

  .play-btn {
    font-size: 1.15rem;
    padding: 18px 48px;
    margin-bottom: 18px;
  }

  .theme-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 8px;
  }

  .theme-swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    margin: 0;
    cursor: pointer;
    border: 2px solid var(--border);
    box-shadow: none;
  }

  .theme-swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25);
  }

  .swatch-default { background: linear-gradient(135deg, #1b1730, #7c5cff); }
  .swatch-black { background: #000; }
  .swatch-white { background: #fff; border-color: #ccc; }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
    width: 100%;
    max-width: 320px;
  }

  .cat-grid .cat-btn:first-child {
    grid-column: 1 / -1;
  }

  .cat-btn {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    box-shadow: none;
    padding: 14px 10px;
    border-radius: 14px;
    font-size: 0.92rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .cat-btn:active { transform: scale(0.97); }

  .cat-btn.selected {
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.12);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 18px;
    width: 100%;
    max-width: 320px;
  }

  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }

  .toggle-switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: background 0.2s ease;
  }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.25s cubic-bezier(.4, .15, .2, 1);
  }

  .toggle-switch input:checked ~ .toggle-track {
    background: var(--accent);
  }

  .toggle-switch input:checked ~ .toggle-track .toggle-thumb {
    transform: translateX(20px);
  }

  .back-link {
    background: none;
    box-shadow: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 6px 10px;
    margin-bottom: 10px;
  }

  .settings-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    box-shadow: none;
    font-size: 0.9rem;
    padding: 10px 20px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .modal-overlay.hidden { display: none; }

  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px;
    width: 100%;
    max-width: 320px;
    animation: cardIn 0.25s ease;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 18px;
  }

  .close-btn {
    background: transparent;
    box-shadow: none;
    color: var(--text-muted);
    padding: 4px 10px;
    margin: 0;
    font-size: 1rem;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    background: var(--bg-inline, transparent);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .lang-btn {
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    margin: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    color: var(--text-muted);
    border-radius: 7px;
  }

  .lang-btn.selected {
    background: var(--accent);
    color: #fff;
  }

  .card-flip {
    width: 100%;
    max-width: 340px;
    margin: 0 auto 22px;
    perspective: 1200px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 300px;
    transition: transform 0.45s cubic-bezier(.4, .15, .2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 34px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card-front {
    background: linear-gradient(150deg, var(--card-bg), rgba(124, 92, 255, 0.08));
  }

  .card-lock {
    font-size: 2.6rem;
    margin-bottom: 14px;
    animation: pulseLock 1.6s ease-in-out infinite;
  }

  @keyframes pulseLock {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .card-inner.loading .card-lock {
    opacity: 0.35;
  }

  .hold-hint {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-muted);
  }

  .card-back {
    transform: rotateY(180deg);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #player-label {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 18px;
    color: var(--text-muted);
  }

  #visual {
    width: 128px;
    height: 128px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: var(--visual-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    overflow: hidden;
  }

  #visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #visual img.logo {
    object-fit: contain;
    background: #fff;
    padding: 14px;
  }

  #role {
    font-size: 1.5rem;
    font-weight: 800;
    min-height: 36px;
  }

  #location {
    font-size: 1rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 600;
  }

  .hidden { display: none; }

  .spy { color: var(--spy-color); }
  .normal { color: var(--normal-color); }
</style>
</head>

          { name: "Nanny", emoji: "👶", noImage: true }
        ] }
      }
    }
  };

  let lang = 'ru';
  const catKeys = ['movies', 'anime', 'animals', 'brands', 'games', 'superheroes', 'famous', 'professions'];
  let selectedCats = [...catKeys];
  const posterCache = {};

  function renderCatGrid() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'cat-btn' + (selectedCats.length === catKeys.length ? ' selected' : '');
    allBtn.textContent = (lang === 'ru' ? '🎲 Все темы вместе' : '🎲 All categories mixed');
    allBtn.onclick = () => {
      selectedCats = [...catKeys];
      renderCatGrid();
    };
    grid.appendChild(allBtn);

    catKeys.forEach(key => {
      const cat = data[lang].categories[key];
      const btn = document.createElement('button');
      const isOnlyThis = selectedCats.length === 1 && selectedCats[0] === key;
      btn.className = 'cat-btn' + (isOnlyThis ? ' selected' : '');
      btn.textContent = cat.icon + ' ' + cat.label;
      btn.onclick = () => {
        selectedCats = [key];
        renderCatGrid();
      };
      grid.appendChild(btn);
    });

    updateCharModeVisibility();
  }

  function updateCharModeVisibility() {
    const row = document.getElementById('charModeRow');
    const isAnimeOnly = selectedCats.length === 1 && selectedCats[0] === 'anime';
    row.classList.toggle('hidden', !isAnimeOnly);
    if (!isAnimeOnly) {
      document.getElementById('charModeCheckbox').checked = false;
    }
  }

  function goToSetup() {
    document.getElementById('start').classList.add('hidden');
    document.getElementById('setup').classList.remove('hidden');
  }

  function goToStart() {
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('start').classList.remove('hidden');
  }

  function openSettings() {
    document.getElementById('settingsModal').classList.remove('hidden');
  }

  function closeSettings() {
    document.getElementById('settingsModal').classList.add('hidden');
  }

  function setTheme(theme, btn) {
    document.body.classList.remove('theme-black', 'theme-white');
    if (theme === 'black') document.body.classList.add('theme-black');
    if (theme === 'white') document.body.classList.add('theme-white');
    document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
    try { localStorage.setItem('echospy_theme', theme); } catch (e) { /* storage unavailable */ }
  }

  function setLang(l) {
    lang = l;
    document.getElementById('langRu').classList.toggle('selected', l === 'ru');
    document.getElementById('langEn').classList.toggle('selected', l === 'en');
    applyTexts();
    renderCatGrid();
    try { localStorage.setItem('echospy_lang', l); } catch (e) { /* storage unavailable */ }
  }

  function applyTexts() {
    const t = data[lang];
    // wordmark "Echospy" is a fixed brand name, not translated
    document.getElementById('t-tagline').textContent = t.tagline;
    document.getElementById('t-play').textContent = t.play;
    document.getElementById('t-settings-btn').textContent = t.settingsBtn;
    document.getElementById('t-settings-title').textContent = t.settingsTitle;
    document.getElementById('t-theme-label').textContent = t.themeLabel;
    document.getElementById('t-back').textContent = t.back;
    document.getElementById('t-lang-label').textContent = t.langLabel;
    document.getElementById('t-choose-cat').textContent = t.chooseCat;
    document.getElementById('t-players').textContent = t.players;
    document.getElementById('t-char-mode').textContent = t.charModeLabel;
    document.getElementById('t-start').textContent = t.start;
    document.getElementById('t-final-title').textContent = t.finalTitle;
    document.getElementById('t-final-sub').textContent = t.finalSub;
    document.getElementById('t-new-game').textContent = t.newGame;
    document.getElementById('t-hold-hint').textContent = t.reveal;
    document.getElementById('nextBtn').textContent = t.next;
  }

  let players = [];
  let currentPlayer = 0;
  let topic = null;
  let spyIndex = 0;

  function startGame() {
    const count = parseInt(document.getElementById('playerCount').value);
    if (count < 3) {
      alert(data[lang].minPlayers);
      return;
    }

    const charModeOn = selectedCats.length === 1 && selectedCats[0] === 'anime' &&
      document.getElementById('charModeCheckbox').checked;

    const pool = [];
    if (charModeOn) {
      data[lang].animeCharacters.forEach(item => pool.push({ ...item, cat: 'anime-character' }));
    } else {
      selectedCats.forEach(key => {
        data[lang].categories[key].items.forEach(item => pool.push({ ...item, cat: key }));
      });
    }

    topic = pool[Math.floor(Math.random() * pool.length)];
    spyIndex = Math.floor(Math.random() * count);
    players = Array.from({ length: count }, (_, i) => i);
    currentPlayer = 0;

    document.getElementById('setup').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    showPlayerTurn();
  }

  function showPlayerTurn() {
    document.getElementById('player-label').textContent =
      data[lang].passLabel.replace('X', currentPlayer + 1);
    document.getElementById('visual').innerHTML = "";
    document.getElementById('role').textContent = "";
    document.getElementById('location').textContent = "";
    document.getElementById('nextBtn').classList.add('hidden');

    const cardInner = document.getElementById('cardInner');
    cardInner.classList.remove('flipped');
    cardInner.classList.add('loading');
    cardReady = false;
    hasRevealedThisTurn = false;

    prepareCard();
  }

  async function fetchAnilistCover(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    try {
      const query = `query ($search: String) { Media(search: $search, type: ANIME) { coverImage { large } } }`;
      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query, variables: { search: title } })
      });
      const json = await res.json();
      const src = json.data && json.data.Media && json.data.Media.coverImage
        ? json.data.Media.coverImage.large : null;
      posterCache[title] = src;
      return src;
    } catch (e) {
      posterCache[title] = null;
      return null;
    }
  }

  async function fetchAnilistCharacter(name) {
    const cacheKey = "char:" + name;
    if (posterCache[cacheKey] !== undefined) return posterCache[cacheKey];
    try {
      const query = `query ($search: String) { Character(search: $search) { image { large } } }`;
      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query, variables: { search: name } })
      });
      const json = await res.json();
      const src = json.data && json.data.Character && json.data.Character.image
        ? json.data.Character.image.large : null;
      posterCache[cacheKey] = src;
      return src;
    } catch (e) {
      posterCache[cacheKey] = null;
      return null;
    }
  }

  async function fetchWikiSummary(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    const candidates = [];

    try {
      const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(title.replace(/ /g, "_"));
      const res = await fetch(url);
      if (res.ok) {
        const json = await res.json();
        if (json.originalimage && json.originalimage.source) candidates.push(json.originalimage.source);
        if (json.thumbnail && json.thumbnail.source) candidates.push(json.thumbnail.source);
      }
    } catch (e) { /* ignore, try next method */ }

    try {
      const url2 = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" +
        encodeURIComponent(title) + "&gsrlimit=1&prop=pageimages&piprop=original|thumbnail&pithumbsize=400&format=json&origin=*";
      const res2 = await fetch(url2);
      if (res2.ok) {
        const json2 = await res2.json();
        const pages = json2.query && json2.query.pages;
        if (pages) {
          const page = Object.values(pages)[0];
          if (page.original && page.original.source) candidates.push(page.original.source);
          if (page.thumbnail && page.thumbnail.source) candidates.push(page.thumbnail.source);
        }
      }
    } catch (e) { /* ignore */ }

    posterCache[title] = candidates.length ? candidates : null;
    return posterCache[title];
  }

  async function fetchPoster(topicItem) {
    if (topicItem.cat === "anime-character") {
      const src = await fetchAnilistCharacter(topicItem.wiki);
      return src ? [src] : [];
    }
    if (topicItem.cat === "anime") {
      const src = await fetchAnilistCover(topicItem.wiki);
      return src ? [src] : [];
    }
    if (topicItem.steam) {
      const steamUrl = "https://cdn.cloudflare.steamstatic.com/steam/apps/" + topicItem.steam + "/header.jpg";
      const wikiCandidates = topicItem.wiki ? (await fetchWikiSummary(topicItem.wiki)) || [] : [];
      return [steamUrl, ...wikiCandidates];
    }
    const candidates = await fetchWikiSummary(topicItem.wiki);
    return candidates || [];
  }

  async function prepareCard() {
    const roleEl = document.getElementById('role');
    const locEl = document.getElementById('location');
    const visualEl = document.getElementById('visual');
    const t = data[lang];

    if (currentPlayer === spyIndex) {
      roleEl.textContent = t.spyRole;
      roleEl.className = "spy";
      locEl.textContent = t.spyHint;
      visualEl.innerHTML = "❓";
    } else {
      roleEl.textContent = t.normalRole;
      roleEl.className = "normal";
      locEl.textContent = t.normalHint + " " + topic.name + (topic.anime ? " (" + topic.anime + ")" : "");

      if (topic.domain) {
        const logoCandidates = [
          "https://logo.clearbit.com/" + topic.domain,
          "https://www.google.com/s2/favicons?domain=" + topic.domain + "&sz=128"
        ];
        let logoIdx = 0;
        const logoImg = document.createElement('img');
        logoImg.className = "logo";
        logoImg.alt = "";
        logoImg.onerror = function () {
          logoIdx++;
          if (logoIdx < logoCandidates.length) {
            logoImg.src = logoCandidates[logoIdx];
          } else {
            visualEl.textContent = "🏷️";
          }
        };
        logoImg.src = logoCandidates[0];
        visualEl.innerHTML = "";
        visualEl.appendChild(logoImg);
      } else {
        visualEl.textContent = topic.emoji;
        if (!topic.noImage) {
          const candidates = await fetchPoster(topic);
          if (candidates && candidates.length) {
            let idx = 0;
            const img = document.createElement('img');
            img.alt = "";
            img.onerror = function () {
              idx++;
              if (idx < candidates.length) {
                img.src = candidates[idx];
              } else {
                visualEl.textContent = topic.emoji;
              }
            };
            img.src = candidates[0];
            visualEl.innerHTML = "";
            visualEl.appendChild(img);
          }
        }
      }
    }

    cardReady = true;
    document.getElementById('cardInner').classList.remove('loading');
  }

  let cardReady = false;
  let hasRevealedThisTurn = false;

  const cardInnerEl = document.getElementById('cardInner');

  function flipUp() {
    if (!cardReady) return;
    cardInnerEl.classList.add('flipped');
  }

  function flipDown() {
    if (cardInnerEl.classList.contains('flipped')) {
      cardInnerEl.classList.remove('flipped');
      if (!hasRevealedThisTurn) {
        hasRevealedThisTurn = true;
        document.getElementById('nextBtn').classList.remove('hidden');
      }
    }
  }

  cardInnerEl.addEventListener('pointerdown', flipUp);
  cardInnerEl.addEventListener('pointerup', flipDown);
  cardInnerEl.addEventListener('pointerleave', flipDown);
  cardInnerEl.addEventListener('pointercancel', flipDown);
  cardInnerEl.addEventListener('contextmenu', (e) => e.preventDefault());

  function next() {
    currentPlayer++;
    if (currentPlayer >= players.length) {
      document.getElementById('game').classList.add('hidden');
      document.getElementById('finalMsg').classList.remove('hidden');
    } else {
      showPlayerTurn();
    }
  }

  try {
    const savedTheme = localStorage.getItem('echospy_theme');
    if (savedTheme && savedTheme !== 'default') {
      const swatchBtn = document.querySelector('.swatch-' + savedTheme);
      if (swatchBtn) setTheme(savedTheme, swatchBtn);
    }
  } catch (e) { /* storage unavailable */ }

  try {
    const savedLang = localStorage.getItem('echospy_lang');
    if (savedLang && savedLang !== 'ru') {
      setLang(savedLang);
    }
  } catch (e) { /* storage unavailable */ }

  renderCatGrid();
  applyTexts();
</script>

</body>
</html>
