<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Echospy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echospy">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: radial-gradient(circle at 50% 0%, #1b1730 0%, #0e0c17 55%, #09070f 100%);
    --text: #f4f2fb;
    --text-muted: #9c95b8;
    --card-bg: #171425;
    --card-glass: rgba(23, 20, 37, 0.6);
    --border: #2b2542;
    --input-bg: #171425;
    --accent: #7c5cff;
    --accent2: #ff7ac8;
    --btn-grad: linear-gradient(135deg, #8360ff, #6c4ce0);
    --btn-shadow: 0 8px 24px -8px rgba(124, 92, 255, 0.55);
    --visual-bg: #0e0c17;
    --spy-color: #ff5c8a;
    --normal-color: #4ee39a;
    --blob1: rgba(124, 92, 255, 0.35);
    --blob2: rgba(255, 122, 200, 0.28);
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-bg-soft: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.22);
    --glass-shine: rgba(255, 255, 255, 0.28);
  }

  body.theme-black {
    --bg: #000000;
    --text: #f2f2f2;
    --text-muted: #8a8a8a;
    --card-bg: #121212;
    --card-glass: rgba(18, 18, 18, 0.6);
    --border: #2a2a2a;
    --input-bg: #121212;
    --accent: #ffffff;
    --accent2: #b0b0b0;
    --btn-grad: linear-gradient(135deg, #333333, #000000);
    --btn-shadow: 0 8px 20px -8px rgba(255, 255, 255, 0.12);
    --visual-bg: #0a0a0a;
    --spy-color: #ff6161;
    --normal-color: #6be38a;
    --blob1: rgba(255, 255, 255, 0.06);
    --blob2: rgba(255, 255, 255, 0.03);
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-bg-soft: rgba(255, 255, 255, 0.02);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-shine: rgba(255, 255, 255, 0.18);
  }

  body.theme-white {
    --bg: #f5f4fa;
    --text: #1b1830;
    --text-muted: #6d6683;
    --card-bg: #ffffff;
    --card-glass: rgba(255, 255, 255, 0.7);
    --border: #e4e1ef;
    --input-bg: #ffffff;
    --accent: #7c5cff;
    --accent2: #ff5cab;
    --btn-grad: linear-gradient(135deg, #8360ff, #6c4ce0);
    --btn-shadow: 0 8px 20px -8px rgba(124, 92, 255, 0.35);
    --visual-bg: #f0eefa;
    --spy-color: #e0356f;
    --normal-color: #1fa869;
    --blob1: rgba(124, 92, 255, 0.12);
    --blob2: rgba(255, 92, 171, 0.1);
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-bg-soft: rgba(255, 255, 255, 0.25);
    --glass-border: rgba(17, 15, 30, 0.1);
    --glass-shine: rgba(255, 255, 255, 0.85);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
    transition: background 0.2s ease, color 0.2s ease;
    position: relative;
    overflow-x: hidden;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
    transition: background 0.3s ease;
  }

  .bg-blob.b1 {
    width: 340px;
    height: 340px;
    top: -80px;
    left: -80px;
    background: var(--blob1);
    animation: floatBlob1 16s ease-in-out infinite;
  }

  .bg-blob.b2 {
    width: 300px;
    height: 300px;
    bottom: -60px;
    right: -60px;
    background: var(--blob2);
    animation: floatBlob2 18s ease-in-out infinite;
  }

  @keyframes floatBlob1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 50px) scale(1.15); }
  }

  @keyframes floatBlob2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, -40px) scale(1.1); }
  }

  .screen {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: screenIn 0.5s cubic-bezier(.4, .15, .2, 1);
  }

  .screen.hidden { display: none; }

  @keyframes screenIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-icon {
    width: 84px;
    height: auto;
    display: block;
    margin: 0 auto -14px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 8px 18px rgba(124, 92, 255, 0.45));
  }

  body.theme-white .logo-icon {
    filter: invert(1) drop-shadow(0 8px 18px rgba(124, 92, 255, 0.3));
  }

  .wordmark {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    padding-top: 24px;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  .accent-part {
    background: linear-gradient(90deg, #b79cff, var(--accent) 40%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #b79cff, var(--accent) 55%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 22px;
    font-weight: 600;
  }

  input {
    width: 110px;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    margin-bottom: 18px;
  }

  input:focus { outline: none; border-color: var(--accent); }

  .player-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-width: 140px;
    margin: 0 auto 16px;
    padding: 8px 22px;
    border-radius: 999px;
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }

  .player-stepper.dragging { cursor: grabbing; }

  .stepper-value-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    pointer-events: none;
  }

  .stepper-value {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    transition: transform 0.12s ease;
  }

  .player-stepper.dragging .stepper-value {
    transform: scale(1.12);
  }

  .stepper-hint {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    opacity: 0.65;
  }

  button {
    padding: 15px 30px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    background-color: var(--glass-bg);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: var(--text);
    cursor: pointer;
    margin: 6px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 26px -12px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
  }

  button:active { transform: scale(0.97); }

  .play-btn {
    font-size: 1.15rem;
    padding: 18px 48px;
    margin-bottom: 18px;
    color: #fff;
    background-color: rgba(124, 92, 255, 0.4);
    background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.45), transparent 60%),
      linear-gradient(135deg, rgba(131, 96, 255, 0.55), rgba(255, 122, 200, 0.35));
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 14px 30px -12px rgba(124, 92, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .theme-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 8px;
  }

  .theme-swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    margin: 0;
    cursor: pointer;
    border: 2px solid var(--border);
    box-shadow: none;
  }

  .theme-swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25);
  }

  .swatch-default { background: linear-gradient(135deg, #1b1730, #7c5cff); }
  .swatch-black { background: #000; }
  .swatch-white { background: #fff; border-color: #ccc; }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
    width: 100%;
    max-width: 320px;
    touch-action: none;
  }

  .cat-grid .cat-btn:first-child {
    grid-column: 1 / -1;
  }

  .cat-btn {
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-border);
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    padding: 14px 10px;
    border-radius: 14px;
    font-size: 0.92rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .cat-btn .cat-icon {
    font-size: 1rem;
    line-height: 1;
  }

  .cat-btn .cat-label {
    line-height: 1.15;
  }

  .cat-btn:active { transform: scale(0.97); }

  .cat-btn.selected {
    border-color: var(--accent);
    background-color: rgba(124, 92, 255, 0.16);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .cat-btn.glide {
    border-color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6), 0 0 18px rgba(255, 255, 255, 0.3);
    transform: scale(1.03);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    cursor: pointer;
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 18px;
    width: 100%;
    max-width: 320px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }

  .toggle-switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: background 0.2s ease;
  }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.25s cubic-bezier(.4, .15, .2, 1);
  }

  .toggle-switch input:checked ~ .toggle-track {
    background: var(--accent);
  }

  .toggle-switch input:checked ~ .toggle-track .toggle-thumb {
    transform: translateX(20px);
  }

  .back-link {
    background: none;
    box-shadow: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 6px 10px;
    margin-bottom: 10px;
  }

  .online-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .online-stepper button {
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 1.1rem;
    border-radius: 50%;
  }

  .online-stepper span {
    font-size: 1.1rem;
    font-weight: 800;
    min-width: 24px;
    text-align: center;
  }

  .online-slots-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin: 0 0 16px;
  }

  .online-slot {
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 82px;
  }

  .online-slot.empty {
    border-style: dashed;
    color: var(--text-muted);
    font-size: 1.4rem;
    font-weight: 700;
  }

  .online-slot.empty.clickable {
    cursor: pointer;
  }

  .online-slot.empty.clickable:active {
    transform: scale(0.96);
  }

  .online-slot-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
  }

  .online-slot-initial {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
  }

  .online-slot-name {
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .online-code-hint {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 0 0 16px;
  }

  .settings-btn {
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 55%);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    font-size: 0.9rem;
    padding: 10px 20px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .modal-overlay.hidden { display: none; }

  .modal-card {
    background-color: var(--card-glass);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 60%);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 26px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 50px -18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    animation: cardIn 0.25s ease;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 18px;
  }

  .close-btn {
    background: transparent;
    box-shadow: none;
    color: var(--text-muted);
    padding: 4px 10px;
    margin: 0;
    font-size: 1rem;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    background-color: var(--glass-bg-soft);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
  }

  .lang-btn {
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    margin: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    color: var(--text-muted);
    border-radius: 7px;
  }

  .lang-btn.selected {
    background: var(--accent);
    color: #fff;
  }

  .card-flip {
    width: 100%;
    max-width: 340px;
    margin: 0 auto 22px;
    perspective: 1200px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 300px;
    transition: transform 0.45s cubic-bezier(.4, .15, .2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    background-color: var(--card-glass);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 60%);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: 0 20px 44px -18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    padding: 34px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card-front {
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 60%),
      linear-gradient(150deg, rgba(124, 92, 255, 0.12), transparent);
  }

  .card-lock {
    font-size: 2.6rem;
    margin-bottom: 14px;
    animation: pulseLock 1.6s ease-in-out infinite;
  }

  @keyframes pulseLock {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .card-inner.loading .card-lock {
    opacity: 0.35;
  }

  .hold-hint {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-muted);
  }

  .card-back {
    transform: rotateY(180deg);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #player-label {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 18px;
    color: var(--text-muted);
    background-color: var(--glass-bg-soft);
    background-image: linear-gradient(160deg, var(--glass-shine), transparent 60%);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  #visual {
    width: 128px;
    height: 128px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: var(--visual-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    overflow: hidden;
  }

  #visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #visual img.logo {
    object-fit: contain;
    background: #fff;
    padding: 14px;
  }

  #role {
    font-size: 1.5rem;
    font-weight: 800;
    min-height: 36px;
  }

  #location {
    font-size: 1rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 600;
  }

  .hidden { display: none; }

  .spy { color: var(--spy-color); }
  .normal { color: var(--normal-color); }
</style>
</head>
<body class="theme-black">

  <div class="bg-blob b1"></div>

    <button class="settings-btn hidden" id="onlinePlayBtn" onclick="onlineCreateRoom()">🌐 Играть онлайн</button>

  </div>

  <div id="settingsModal" class="modal-overlay hidden" onclick="if(event.target===this) closeSettings()">
    <div class="modal-card">
      <div class="modal-header">
        <span id="t-settings-title">Настройки</span>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>

      <p class="sub" id="t-theme-label">Тема</p>
      <div class="theme-row">
        <button class="theme-swatch swatch-default" onclick="setTheme('default', this)" title="Обычная"></button>
        <button class="theme-swatch swatch-black selected" onclick="setTheme('black', this)" title="Чёрная"></button>
        <button class="theme-swatch swatch-white" onclick="setTheme('white', this)" title="Белая"></button>
      </div>

      <p class="sub" id="t-lang-label">Язык</p>
      <div class="lang-toggle">
        <button class="lang-btn selected" id="langRu" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" id="langEn" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>

  <div id="setup" class="screen hidden">
    <button class="back-link" onclick="goToStart()" id="t-back">← Назад</button>
    <p class="sub" id="t-choose-cat">Выбери тему</p>
    <div class="cat-grid" id="catGrid"></div>

    <label class="checkbox-row hidden" id="charModeRow">
      <span id="t-char-mode">Определённые персонажи</span>
      <span class="toggle-switch">
        <input type="checkbox" id="charModeCheckbox">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </span>
    </label>

    <p class="sub" id="t-players">Сколько игроков?</p>
    <div class="player-stepper" id="playerStepper">
      <div class="stepper-value-wrap">
        <div class="stepper-value" id="playerCountValue">4</div>
        <div class="stepper-hint" id="t-swipe-hint">← свайп →</div>
      </div>
    </div>
    <input type="hidden" id="playerCount" value="4" min="3" max="12">
    <br>
    <button onclick="startGame()" id="t-start">Начать игру</button>
  </div>

  <div id="game" class="screen hidden">
    <div id="player-label"></div>
    <div class="card-flip" id="cardFlip">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-lock">🔒</div>
          <div class="hold-hint" id="t-hold-hint">Зажми и держи</div>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div id="visual"></div>
          <div id="role"></div>
          <div id="location"></div>
        </div>
      </div>
    </div>
    <button id="nextBtn" class="hidden" onclick="next()"></button>
    <button id="t-online-leave" class="back-link hidden" onclick="leaveOnlineRoom()">← Выйти из комнаты</button>
  </div>

  <div id="onlineLobby" class="screen hidden">
    <button class="back-link" onclick="leaveOnlineRoom()" id="t-online-leave2">← Выйти из комнаты</button>
    <p class="sub" id="t-online-title">🌐 Онлайн-комната</p>

    <div class="online-stepper hidden" id="onlineSlotsStepper">
      <button type="button" onclick="onlineChangeSlots(-1)">−</button>
      <span id="onlineSlotsValue">4</span>
      <button type="button" onclick="onlineChangeSlots(1)">+</button>
    </div>

    <div class="online-slots-grid" id="onlineSlotsGrid"></div>

    <p class="online-code-hint"><span id="t-online-code">Код комнаты:</span> <strong id="onlineCodeValue"></strong></p>

    <p class="sub hidden" id="onlineWaitingText">Ждём, пока хост начнёт игру…</p>
    <p class="sub hidden" id="onlineErrorText"></p>

    <button class="back-link hidden" id="onlineCopyBtn" onclick="onlineCopyLink()">🔗 Скопировать ссылку-приглашение</button>
    <button class="hidden" id="onlineStartBtn" onclick="onlineStartGame()">Начать игру</button>
  </div>

  </div>

  function renderCatGrid() {
    const grid = document.getElementById('catGrid');

    allBtn.className = 'cat-btn' + (selectedCats.length === catKeys.length ? ' selected' : '');

      (lang === 'ru' ? 'Все темы вместе' : 'All categories mixed') + '</span>';
    allBtn.onclick = () => {
      selectedCats = [...catKeys];
      renderCatGrid();
    };
    grid.appendChild(allBtn);

    catKeys.forEach(key => {
      const cat = data[lang].categories[key];
      const btn = document.createElement('button');
      const isSelected = selectedCats.length < catKeys.length && selectedCats.includes(key);
      btn.className = 'cat-btn' + (isSelected ? ' selected' : '');
      btn.innerHTML = '<span class="cat-icon">' + cat.icon + '</span><span class="cat-label">' + cat.label + '</span>';
      btn.onclick = () => {
        const wasAll = selectedCats.length === catKeys.length;
        if (wasAll || !selectedCats.includes(key)) {
          selectedCats = wasAll ? [key] : [...selectedCats, key];
        } else if (selectedCats.length > 1) {
          selectedCats = selectedCats.filter(k => k !== key);
        } else {
          return;

        renderCatGrid();
      };
      grid.appendChild(btn);
    });

    updateCharModeVisibility();

  async function fetchAnilistCover(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    try {
      const query = `query ($search: String) { Media(search: $search, type: ANIME) { coverImage { large } } }`;
      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query, variables: { search: title } })
      });
      const json = await res.json();
      const src = json.data && json.data.Media && json.data.Media.coverImage
        ? json.data.Media.coverImage.large : null;
      posterCache[title] = src;
      return src;
    } catch (e) {
      posterCache[title] = null;
      return null;
    }
  }

  async function fetchAnilistCharacter(name) {
    const cacheKey = "char:" + name;
    if (posterCache[cacheKey] !== undefined) return posterCache[cacheKey];
    try {
      const query = `query ($search: String) { Character(search: $search) { image { large } } }`;
      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query, variables: { search: name } })
      });
      const json = await res.json();
      const src = json.data && json.data.Character && json.data.Character.image
        ? json.data.Character.image.large : null;
      posterCache[cacheKey] = src;
      return src;
    } catch (e) {
      posterCache[cacheKey] = null;
      return null;
    }
  }

  async function fetchWikiSummary(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    const candidates = [];

    try {
      const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(title.replace(/ /g, "_"));
      const res = await fetch(url);
      if (res.ok) {
        const json = await res.json();
        if (json.originalimage && json.originalimage.source) candidates.push(json.originalimage.source);
        if (json.thumbnail && json.thumbnail.source) candidates.push(json.thumbnail.source);
      }
    } catch (e) { /* ignore, try next method */ }

    try {
      const url2 = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" +
        encodeURIComponent(title) + "&gsrlimit=1&prop=pageimages&piprop=original|thumbnail&pithumbsize=400&format=json&origin=*";
      const res2 = await fetch(url2);
      if (res2.ok) {
        const json2 = await res2.json();
        const pages = json2.query && json2.query.pages;
        if (pages) {
          const page = Object.values(pages)[0];
          if (page.original && page.original.source) candidates.push(page.original.source);
          if (page.thumbnail && page.thumbnail.source) candidates.push(page.thumbnail.source);
        }
      }
    } catch (e) { /* ignore */ }

    posterCache[title] = candidates.length ? candidates : null;
    return posterCache[title];
  }

  async function fetchPoster(topicItem) {
    if (topicItem.cat === "anime-character") {
      const src = await fetchAnilistCharacter(topicItem.wiki);
      return src ? [src] : [];
    }
    if (topicItem.cat === "anime") {
      const src = await fetchAnilistCover(topicItem.wiki);
      return src ? [src] : [];
    }
    if (topicItem.steam) {
      const steamUrl = "https://cdn.cloudflare.steamstatic.com/steam/apps/" + topicItem.steam + "/header.jpg";
      const wikiCandidates = topicItem.wiki ? (await fetchWikiSummary(topicItem.wiki)) || [] : [];
      return [steamUrl, ...wikiCandidates];
    }
    const candidates = await fetchWikiSummary(topicItem.wiki);
    return candidates || [];
  }

  async function prepareCard() {
    const roleEl = document.getElementById('role');
    const locEl = document.getElementById('location');
    const visualEl = document.getElementById('visual');
    const t = data[lang];
    const isSpy = onlineMode ? onlineIsSpy : (currentPlayer === spyIndex);

    if (isSpy) {
      roleEl.textContent = t.spyRole;
      roleEl.className = "spy";
      locEl.textContent = t.spyHint;
      visualEl.innerHTML = "❓";
    } else {
      roleEl.textContent = t.normalRole;
      roleEl.className = "normal";
      locEl.textContent = t.normalHint + " " + topic.name + (topic.anime ? " (" + topic.anime + ")" : "");

      if (topic.domain) {
        const logoCandidates = [
          "https://logo.clearbit.com/" + topic.domain,
          "https://www.google.com/s2/favicons?domain=" + topic.domain + "&sz=128"
        ];
        let logoIdx = 0;
        const logoImg = document.createElement('img');
        logoImg.className = "logo";
        logoImg.alt = "";
        logoImg.onerror = function () {
          logoIdx++;
          if (logoIdx < logoCandidates.length) {
            logoImg.src = logoCandidates[logoIdx];
          } else {
            visualEl.textContent = "🏷️";
          }
        };
        logoImg.src = logoCandidates[0];
        visualEl.innerHTML = "";
        visualEl.appendChild(logoImg);
      } else {
        visualEl.textContent = topic.emoji;
        if (!topic.noImage) {
          const candidates = await fetchPoster(topic);
          if (candidates && candidates.length) {
            let idx = 0;
            const img = document.createElement('img');
            img.alt = "";
            img.onerror = function () {
              idx++;
              if (idx < candidates.length) {
                img.src = candidates[idx];
              } else {
                visualEl.textContent = topic.emoji;
              }
            };
            img.src = candidates[0];
            visualEl.innerHTML = "";
            visualEl.appendChild(img);
          }
        }
      }
    }

    cardReady = true;
    document.getElementById('cardInner').classList.remove('loading');
  }

  function onlineInvite() {
    const link = onlineInviteLink();
    const caption = lang === 'ru' ? 'Присоединяйся к комнате в Echospy!' : 'Join my Echospy room!';
    const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(caption);
    const tg = getTelegramWebApp();
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(shareUrl);
    } else {
      window.open(shareUrl, '_blank');
    }
  }

  function onlineCopyLink() {
    const link = onlineInviteLink();
    const tg = getTelegramWebApp();
    const onDone = () => {
      onlineCopyDoneShown = true;
      const btn = document.getElementById('onlineCopyBtn');
      btn.textContent = data[lang].onlineCopyLinkDone;
      vibrate(10);
      setTimeout(() => {
        onlineCopyDoneShown = false;
        document.getElementById('onlineCopyBtn').textContent = data[lang].onlineCopyLink;
      }, 1800);
    };
    if (tg && tg.setClipboardText) {
      tg.setClipboardText(link);
      onDone();
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(onDone).catch(() => showOnlineError(data[lang].onlineError));
    } else {
      showOnlineError(data[lang].onlineError);
    }
  }

  function onlineChangeSlots(delta) {
    onlineTargetSlots = Math.max(3, Math.min(12, onlineTargetSlots + delta));
    document.getElementById('onlineSlotsValue').textContent = onlineTargetSlots;
    renderOnlineSlots(onlineCurrentPlayers);
  }

  function renderOnlineSlots(players) {
    const grid = document.getElementById('onlineSlotsGrid');
    grid.innerHTML = '';
    const slotCount = Math.max(onlineTargetSlots, players.length);
    for (let i = 0; i < slotCount; i++) {
      const div = document.createElement('div');
      if (i < players.length) {
        const p = players[i];
        div.className = 'online-slot filled';
        if (p.photoUrl) {
          const img = document.createElement('img');
          img.className = 'online-slot-avatar';
          img.alt = '';
          img.onerror = () => {
            img.remove();
            div.insertBefore(makeInitialAvatar(p.name), div.firstChild);
          };
          img.src = p.photoUrl;
          div.appendChild(img);
        } else {
          div.appendChild(makeInitialAvatar(p.name));
        }
        const nameEl = document.createElement('span');
        nameEl.className = 'online-slot-name';
        nameEl.textContent = p.name;
        div.appendChild(nameEl);
      } else {
        div.className = 'online-slot empty' + (onlineIsHost ? ' clickable' : '');
        div.textContent = '+';
        if (onlineIsHost) div.onclick = onlineInvite;
      }
      grid.appendChild(div);
    }
  }

  function renderOnlineLobby(roomData) {
    document.getElementById('onlineErrorText').classList.add('hidden');
    onlineCurrentPlayers = roomData.players;
    if (typeof roomData.hostId !== 'undefined') {
      const tg = getTelegramWebApp();
      const myId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
      onlineIsHost = myId !== null && myId === roomData.hostId;
    }
    renderOnlineSlots(roomData.players);

    const startBtn = document.getElementById('onlineStartBtn');
    const waitingText = document.getElementById('onlineWaitingText');
    const copyBtn = document.getElementById('onlineCopyBtn');
    const stepper = document.getElementById('onlineSlotsStepper');
    if (onlineIsHost) {
      startBtn.classList.remove('hidden');
      waitingText.classList.add('hidden');
      copyBtn.classList.remove('hidden');
      stepper.classList.remove('hidden');
      startBtn.disabled = !onlineCanStart();
      startBtn.textContent = onlineCanStart() ? data[lang].onlineStartBtn : data[lang].onlineNeedMore;
    } else {
      startBtn.classList.add('hidden');
      waitingText.classList.remove('hidden');
      copyBtn.classList.add('hidden');
      stepper.classList.add('hidden');
    }
  }

  async function onlineJoinRoom() {
    try {
      const res = await fetch(ONLINE_API + '/api/room/' + onlineRoomCode + '/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: getTelegramInitData() }),
      });
      if (res.status === 404) {
        showOnlineError(data[lang].onlineNotFound);
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        if (body.error === 'auth_failed') {
          showOnlineError(data[lang].onlineOnlyInApp);
        } else if (body.error !== 'already_started') {
          showOnlineError(data[lang].onlineError);
        }
      }
    } catch (e) { /* сеть недоступна — опрос попробует снова */ }
  }

  async function pollOnlineRoom() {
    if (!onlineRoomCode) return;
    try {
      const res = await fetch(ONLINE_API + '/api/room/' + onlineRoomCode);
      if (res.status === 404) {
        showOnlineError(data[lang].onlineNotFound);
        clearInterval(onlinePollTimer);
        return;
      }
      if (!res.ok) return;
      const roomData = await res.json();
      if (roomData.started && !onlineStarted) {
        onlineStarted = true;
        clearInterval(onlinePollTimer);
        fetchOnlineRole();
        return;
      }
      if (!roomData.started) {
        renderOnlineLobby(roomData);
      }
    } catch (e) { /* сеть недоступна — попробуем на следующем опросе */ }
  }

  async function onlineStartGame() {
    if (!onlineCanStart()) {
      showOnlineError(data[lang].onlineNeedMore);
      return;
    }
    const pool = [];
    catKeys.forEach(key => {
      data[lang].categories[key].items.forEach(item => pool.push({ ...item, cat: key }));
    });
    const chosenTopic = pool[Math.floor(Math.random() * pool.length)];
    try {
      const res = await fetch(ONLINE_API + '/api/room/' + onlineRoomCode + '/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: getTelegramInitData(), topic: chosenTopic }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        if (body.error === 'not_enough_players') {
          showOnlineError(data[lang].onlineNeedMore);
        } else {
          showOnlineError(data[lang].onlineError);
        }
        return;
      }
      if (!onlineStarted) {
        onlineStarted = true;
        if (onlinePollTimer) clearInterval(onlinePollTimer);
        fetchOnlineRole();
      }
    } catch (e) {
      showOnlineError(data[lang].onlineError);
    }
  }

  async function fetchOnlineRole() {
    try {
      const res = await fetch(ONLINE_API + '/api/room/' + onlineRoomCode + '/role', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: getTelegramInitData() }),
      });
      if (!res.ok) {
        showOnlineError(data[lang].onlineError);
        return;
      }
      const roleData = await res.json();
      onlineIsSpy = roleData.isSpy;
      topic = roleData.topic || null;

      document.getElementById('onlineLobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('player-label').textContent = data[lang].onlineYourRole;
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('t-online-leave').classList.add('hidden');

      const cardInner = document.getElementById('cardInner');
      cardInner.classList.remove('flipped');
      cardInner.classList.add('loading');
      cardReady = false;
      hasRevealedThisTurn = false;
      prepareCard();
    } catch (e) {
      showOnlineError(data[lang].onlineError);
    }
  }

  function leaveOnlineRoom() {
    if (onlinePollTimer) clearInterval(onlinePollTimer);
    onlineMode = false;
    onlineRoomCode = null;
    onlineStarted = false;
    window.location.href = window.location.pathname;
  }

  function enterOnlineLobby(code, isHost) {
    onlineMode = true;
    onlineRoomCode = code.toUpperCase();
    onlineIsHost = !!isHost;
    onlineStarted = false;

    const tg = getTelegramWebApp();
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) { /* ignore */ }
    }

    document.getElementById('start').classList.add('hidden');
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('onlineLobby').classList.remove('hidden');
    document.getElementById('onlineCodeValue').textContent = onlineRoomCode;
    document.getElementById('onlineSlotsValue').textContent = onlineTargetSlots;

    if (onlinePollTimer) clearInterval(onlinePollTimer);
    pollOnlineRoom();
    onlinePollTimer = setInterval(pollOnlineRoom, 3000);
  }

  async function onlineCreateRoom() {
    const tg = getTelegramWebApp();
    if (!tg) {
      alert(data[lang].onlineOnlyInApp);
      return;
    }
    try {
      const res = await fetch(ONLINE_API + '/api/room/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: getTelegramInitData() }),
      });
      if (!res.ok) {
        alert(data[lang].onlineError);
        return;
      }
      const body = await res.json();
      enterOnlineLobby(body.code, true);
    } catch (e) {
      alert(data[lang].onlineError);
    }
  }

  async function initOnlineMode(code) {
    onlineRoomCode = code.toUpperCase();
    await onlineJoinRoom();
    enterOnlineLobby(code, false);
  }

  try {
    const tg0 = getTelegramWebApp();
    if (tg0) document.getElementById('onlinePlayBtn').classList.remove('hidden');
  } catch (e) { /* ignore */ }

  try {
    const roomParam = new URLSearchParams(window.location.search).get('room');
    if (roomParam) initOnlineMode(roomParam);
  } catch (e) { /* ignore */ }

  try {
    const savedTheme = localStorage.getItem('echospy_theme');
    if (savedTheme && savedTheme !== 'black') {
      const swatchBtn = document.querySelector('.swatch-' + savedTheme);
      if (swatchBtn) setTheme(savedTheme, swatchBtn);
    }
  } catch (e) { /* storage unavailable */ }

  try {
    const savedLang = localStorage.getItem('echospy_lang');
    if (savedLang && savedLang !== 'ru') {
      setLang(savedLang);
    }
  } catch (e) { /* storage unavailable */ }

  function initCatGridGlide() {
    const grid = document.getElementById('catGrid');
    let dragging = false;
    let currentGlide = null;

    function setGlide(el) {
      if (currentGlide === el) return;
      if (currentGlide) currentGlide.classList.remove('glide');
      currentGlide = el;
      if (currentGlide) currentGlide.classList.add('glide');
    }

    function btnFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest('.cat-btn') : null;
    }

    grid.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      dragging = true;
      setGlide(btn);
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });

    grid.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const btn = btnFromPoint(e.clientX, e.clientY);
      if (btn && grid.contains(btn)) setGlide(btn);
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const toSelect = currentGlide;
      setGlide(null);
      if (toSelect) toSelect.click();
    }

    grid.addEventListener('pointerup', endDrag);
    grid.addEventListener('pointercancel', endDrag);
    grid.addEventListener('lostpointercapture', endDrag);
  }

  function initPlayerStepper() {
    const stepper = document.getElementById('playerStepper');
    const valueEl = document.getElementById('playerCountValue');
    const hiddenInput = document.getElementById('playerCount');
    const MIN = 3, MAX = 12;
    const STEP_PX = 34;
    let count = parseInt(hiddenInput.value, 10) || 4;

    function render() {
      valueEl.textContent = count;
      hiddenInput.value = count;
    }

    function setCount(n) {
      const clamped = Math.max(MIN, Math.min(MAX, n));
      if (clamped !== count) {
        count = clamped;
        render();
      }
    }

    let startX = null;
    let consumed = 0;

    stepper.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      consumed = 0;
      stepper.classList.add('dragging');
      stepper.setPointerCapture(e.pointerId);
    });

    stepper.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = (e.clientX - startX) - consumed;
      const steps = Math.trunc(dx / STEP_PX);
      if (steps !== 0) {
        setCount(count + steps);
        consumed += steps * STEP_PX;
      }
    });

    function endDrag() {
      startX = null;
      consumed = 0;
      stepper.classList.remove('dragging');
    }
    stepper.addEventListener('pointerup', endDrag);
    stepper.addEventListener('pointerleave', endDrag);
    stepper.addEventListener('pointercancel', endDrag);

    render();
  }

  renderCatGrid();
  applyTexts();
  initCatGridGlide();
  initPlayerStepper();
</script>
