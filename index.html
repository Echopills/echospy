<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра Шпион</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #12101a;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  h1 { margin-bottom: 8px; }
  .sub { color: #999; margin-bottom: 24px; }

  input {
    width: 100px;
    padding: 10px;
    font-size: 1.2rem;
    text-align: center;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1e1c28;
    color: #fff;
    margin-bottom: 16px;
  }

  button {
    padding: 14px 28px;
    font-size: 1.05rem;
    border: none;
    border-radius: 8px;
    background: #6c4ce0;
    color: #fff;
    cursor: pointer;
    margin: 6px;
  }

  button:active { background: #543aad; }

  .cat-btn {
    background: #1e1c28;
    border: 2px solid #333;
    width: 100%;
    max-width: 280px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cat-btn.selected {
    border-color: #6c4ce0;
    background: #2a2440;
  }

  .cat-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
    width: 100%;
    max-width: 280px;
  }

  .lang-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 6px;
  }

  .lang-btn {
    padding: 6px 14px;
    font-size: 0.85rem;
    margin: 0;
    background: #1e1c28;
    border: 1px solid #444;
  }

  .lang-btn.selected {
    background: #6c4ce0;
    border-color: #6c4ce0;
  }

  #card {
    background: #1e1c28;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 24px;
  }

  #player-label {
    font-size: 1.3rem;
    margin-bottom: 20px;
    color: #aaa;
  }

  #visual {
    width: 130px;
    height: 130px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: #12101a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    overflow: hidden;
  }

  #visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #visual img.logo {
    object-fit: contain;
    background: #fff;
    padding: 12px;
  }

  #role {
    font-size: 1.6rem;
    font-weight: bold;
    min-height: 40px;
  }

  #location {
    font-size: 1.1rem;
    color: #ccc;
    margin-top: 8px;
  }

  .hidden { display: none; }

  .spy { color: #ff4d4d; }
  .normal { color: #4dd67a; }
</style>

  <div class="lang-toggle">

    <button class="lang-btn" id="langEn" onclick="setLang('en')">EN</button>
  </div>

  <div id="setup">
    <h1 id="t-title">Игра "Шпион"</h1>

    <div class="cat-grid" id="catGrid"></div>

    <p class="sub" id="t-players">Сколько игроков?</p>
    <input type="number" id="playerCount" value="4" min="3" max="12">
    <br>
    <button onclick="startGame()" id="t-start">Начать игру</button>
  </div>

  <div id="game" class="hidden">
    <div id="card">
      <div id="player-label"></div>
      <div id="visual"></div>
      <div id="role"></div>
      <div id="location"></div>
    </div>
    <button id="revealBtn" onclick="reveal()"></button>
    <button id="nextBtn" class="hidden" onclick="next()"></button>
  </div>

  <div id="finalMsg" class="hidden">

    <button onclick="location.reload()" id="t-new-game">Новая игра</button>

  let lang = 'ru';
  const catKeys = ['movies', 'anime', 'animals', 'brands', 'games'];
  let selectedCats = [...catKeys];
  const posterCache = {};

  function renderCatGrid() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'cat-btn' + (selectedCats.length === catKeys.length ? ' selected' : '');
    allBtn.textContent = (lang === 'ru' ? '🎲 Все темы вместе' : '🎲 All categories mixed');
    allBtn.onclick = () => {
      selectedCats = [...catKeys];
      renderCatGrid();
    };
    grid.appendChild(allBtn);

    catKeys.forEach(key => {
      const cat = data[lang].categories[key];
      const btn = document.createElement('button');
      const isOnlyThis = selectedCats.length === 1 && selectedCats[0] === key;
      btn.className = 'cat-btn' + (isOnlyThis ? ' selected' : '');
      btn.textContent = cat.icon + ' ' + cat.label;
      btn.onclick = () => {
        selectedCats = [key];
        renderCatGrid();
      };
      grid.appendChild(btn);
    });
  }

  function setLang(l) {
    lang = l;
    document.getElementById('langRu').classList.toggle('selected', l === 'ru');
    document.getElementById('langEn').classList.toggle('selected', l === 'en');
    applyTexts();
    renderCatGrid();
  }

  function applyTexts() {
    const t = data[lang];
    document.getElementById('t-title').textContent = t.title;
    document.getElementById('t-choose-cat').textContent = t.chooseCat;
    document.getElementById('t-players').textContent = t.players;
    document.getElementById('t-start').textContent = t.start;
    document.getElementById('t-final-title').textContent = t.finalTitle;
    document.getElementById('t-final-sub').textContent = t.finalSub;
    document.getElementById('t-new-game').textContent = t.newGame;
    document.getElementById('revealBtn').textContent = t.reveal;
    document.getElementById('nextBtn').textContent = t.next;
  }

  let players = [];
  let currentPlayer = 0;
  let topic = null;
  let spyIndex = 0;

  function startGame() {
    const count = parseInt(document.getElementById('playerCount').value);
    if (count < 3) {
      alert(data[lang].minPlayers);
      return;
    }

    const pool = [];
    selectedCats.forEach(key => {
      data[lang].categories[key].items.forEach(item => pool.push({ ...item, cat: key }));
    });

    topic = pool[Math.floor(Math.random() * pool.length)];
    spyIndex = Math.floor(Math.random() * count);
    players = Array.from({ length: count }, (_, i) => i);
    currentPlayer = 0;

    document.getElementById('setup').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    showPlayerTurn();
  }

  function showPlayerTurn() {
    document.getElementById('player-label').textContent =
      data[lang].passLabel.replace('X', currentPlayer + 1);
    document.getElementById('visual').innerHTML = "";
    document.getElementById('role').textContent = "";
    document.getElementById('location').textContent = "";
    document.getElementById('revealBtn').classList.remove('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
  }

  async function fetchAnilistCover(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    try {
      const query = `query ($search: String) { Media(search: $search, type: ANIME) { coverImage { large } } }`;
      const res = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ query, variables: { search: title } })
      });
      const json = await res.json();
      const src = json.data && json.data.Media && json.data.Media.coverImage
        ? json.data.Media.coverImage.large : null;
      posterCache[title] = src;
      return src;
    } catch (e) {
      posterCache[title] = null;
      return null;
    }
  }

  async function fetchWikiSummary(title) {
    if (posterCache[title] !== undefined) return posterCache[title];
    try {
      const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(title.replace(/ /g, "_"));
      const res = await fetch(url);
      if (!res.ok) { posterCache[title] = null; return null; }
      const json = await res.json();
      const src = json.thumbnail ? json.thumbnail.source : (json.originalimage ? json.originalimage.source : null);
      posterCache[title] = src;
      return src;
    } catch (e) {
      posterCache[title] = null;
      return null;
    }
  }

  async function fetchPoster(topicItem) {
    if (topicItem.cat === "anime") {
      return await fetchAnilistCover(topicItem.wiki);
    }
    if (topicItem.steam) {
      return "https://cdn.cloudflare.steamstatic.com/steam/apps/" + topicItem.steam + "/header.jpg";
    }
    return await fetchWikiSummary(topicItem.wiki);
  }

  async function reveal() {
    const roleEl = document.getElementById('role');
    const locEl = document.getElementById('location');
    const visualEl = document.getElementById('visual');
    const t = data[lang];

    if (currentPlayer === spyIndex) {
      roleEl.textContent = t.spyRole;
      roleEl.className = "spy";
      locEl.textContent = t.spyHint;
      visualEl.innerHTML = "❓";
    } else {
      roleEl.textContent = t.normalRole;
      roleEl.className = "normal";
      locEl.textContent = t.normalHint + " " + topic.name;

      if (topic.domain) {
        visualEl.innerHTML = '<img class="logo" src="https://logo.clearbit.com/' + topic.domain + '" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'🏷️\'}))">';
      } else {
        visualEl.textContent = topic.emoji;
        const src = await fetchPoster(topic);
        if (src) {
          const emojiFallback = topic.emoji;
          visualEl.innerHTML = '<img src="' + src + '" alt="" onerror="this.parentElement.textContent=\'' + emojiFallback + '\'">';
        }
      }
    }

    document.getElementById('revealBtn').classList.add('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
  }

  function next() {
    currentPlayer++;
    if (currentPlayer >= players.length) {
      document.getElementById('game').classList.add('hidden');
      document.getElementById('finalMsg').classList.remove('hidden');
    } else {
      showPlayerTurn();
    }
  }

  renderCatGrid();
  applyTexts();
